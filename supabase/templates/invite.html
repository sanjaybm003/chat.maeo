<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f4f0e8;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f0e8;padding:40px 16px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e5dfd2;border-radius:24px;overflow:hidden;">
          <tr><td style="padding:0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
              <td style="height:12px;background:#f2542d;"></td>
              <td style="height:12px;background:#f5b31b;"></td>
              <td style="height:12px;background:#3355f0;"></td>
              <td style="height:12px;background:#2e9e5b;"></td>
            </tr></table>
          </td></tr>
          <tr><td style="padding:36px 36px 8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#191713;">
            <p style="margin:0 0 24px;font-size:18px;font-weight:700;letter-spacing:-0.5px;">maeosan</p>
            <h1 style="margin:0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-0.8px;">Your team is on maeosan</h1>
            <p style="margin:16px 0 0;font-size:16px;line-height:1.6;color:#4c473d;">
              You've been invited to join <strong style="color:#191713;">{{ .Data.invited_to_workspace }}</strong>. Accept to set up your profile and start talking.
            </p>
          </td></tr>
          <tr><td style="padding:28px 36px 36px;">
            <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=invite" style="display:inline-block;background:#191713;color:#f4f0e8;text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;padding:14px 26px;border-radius:999px;">Accept invitation</a>
          </td></tr>
        </table>
        <p style="margin:20px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;color:#847d6f;">Not expecting this? You can safely ignore it.</p>
      </td></tr>
    </table>
  </body>
</html>
